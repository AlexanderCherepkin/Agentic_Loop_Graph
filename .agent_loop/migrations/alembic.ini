[alembic]
# path to migration scripts
script_location = .agent_loop/migrations

# template used to generate migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# leave blank for local time
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a source .py file to be detected as revisions
# (these will cause an error when upgrading)
# detect_scripts = true

# version path separator; default depends on platform.
version_path_separator = os

# The output encoding used when revision files are written from script.py.mako
output_encoding = utf-8


[post_write_hooks]
# hooks to execute after each migration file is generated
black = black
autoflake = autoflake

# type of hook runner (e.g. 'pre-commit' or 'shell')
type = shell